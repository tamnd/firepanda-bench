name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Lint
        run: |
          [ -d tools ] || { echo "::notice::no harness yet"; exit 0; }
          uvx ruff check . && uvx ruff format --check .

      # pyarrow is here rather than left to skip, because the tests that need it
      # are the ones guarding the cross engine fingerprint, and a fingerprint
      # regression that only shows up as a skipped test is a fingerprint
      # regression that ships.
      #
      # duckdb for the same reason. It is the correctness oracle for two suites
      # and it is the one engine that runs a benchmark's published SQL rather
      # than a port of it, so the tests holding that arrangement in place are
      # worth more than most and they cannot run without it installed.
      #
      # pandas and polars are here because each ClickBench port is checked by
      # running it and DuckDB over the same file and requiring the same answer
      # for all 43. That check is the whole reason a port can be trusted, and
      # without the engine installed it does not fail, it skips.
      - name: Tests
        run: uvx --with pytest --with pyarrow --with duckdb --with pandas --with polars pytest -q

      # Every result file must name every engine version and the Mojo toolchain that
      # compiled firepanda. A result that cannot say what produced it is not a result.
      - name: Results are self-describing
        run: python3 tools/validate_results.py results/

      # The numbers in the suite READMEs are written by a script between markers, and
      # a checkout has no result files in it, so what this can check here is that the
      # digest in the closing marker still matches the block. That catches the edit
      # somebody makes by hand in the GitHub web editor, which is how a generated
      # block rots. The stale against the results case is checked where the results
      # are, which is the scheduled run.
      - name: README blocks have not been edited by hand
        run: python3 tools/suite_readme.py --check

      # The suite is only credible if it reports losses. This is a crude check and it
      # is better than nothing: a published comparison in which firepanda wins every
      # single row, or in which a competing engine crashed on a whole query group,
      # should be looked at by a human before it goes out.
      - name: Flag suspiciously clean sweeps
        run: |
          for f in results/*.json; do
            [ -e "$f" ] || continue
            python3 tools/check_sweep.py "$f" || true
          done
        continue-on-error: true

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --max-concurrency 4 './**/*.md'
          fail: true
