[workspace]
name = "firepanda-bench"
version = "0.0.0"
description = "Performance comparison for firepanda against pandas, Polars, DuckDB, cuDF and MojoFrame"
authors = ["tamnd <tamnd87@gmail.com>"]
license = "Apache-2.0"
channels = ["https://conda.modular.com/max", "https://prefix.dev/modular-community", "conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

# Every version here is pinned and every pin is recorded in the result file. A
# comparison against an unnamed version of anything is not a comparison.
[dependencies]
python = "3.13.*"
modular = "*"

# pandas 3.0 and not 2.x, deliberately. 2.x is what most people are running and it is
# not what firepanda is competing with; using it would inflate every number.
pandas = ">=3.0,<4"
pyarrow = ">=25.0,<26"
polars = ">=1.43,<2"
duckdb = ">=1.1"
numpy = "*"

[feature.report.dependencies]
altair = "*"
jinja2 = "*"

# From M9. Only solvable on linux-64 with a CUDA-capable runner.
[feature.gpu.dependencies]
cudf = "*"

[environments]
default = { solve-group = "main" }
report = { features = ["report"], solve-group = "main" }
gpu = { features = ["gpu"] }

[tasks]
# Generate or fetch datasets. db-benchmark data is generated, TPC-H uses dbgen.
data = "python tools/data.py"

# --runs defaults to 10; the median is reported and the interquartile range is
# published, because a single number with no spread is not a measurement.
bench = "python tools/run.py"

# Re-runs exactly the configuration that produced a given result file. Anyone should
# be able to check any number we publish.
repro = "python tools/repro.py"

report = "python tools/report.py"
site = { cmd = "python tools/site.py", environment = "report" }
env-report = "python tools/env_report.py"

# Crude, and better than nothing: a published comparison in which firepanda wins
# every single row gets looked at by a human before it goes out.
check-sweep = "python tools/check_sweep.py"
